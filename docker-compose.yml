services:
  opencode-oai:
    build: .
    image: opencode-oai:latest
    container_name: opencode-oai
    ports:
      - "5000:5000"
    environment:
      # ── Upstream OpenCode connection ────────────────────────────────────────
      OPENCODE_URL: "http://host.docker.internal:4096"
      # OPENCODE_USERNAME: "opencode"
      # OPENCODE_PASSWORD: ""

      # ── Bridge behavior ─────────────────────────────────────────────────────
      OPENCODE_OAI_DEFAULT_PROVIDER: "github-copilot"
      OPENCODE_OAI_DEFAULT_MODEL: "gpt-4o"
      # Set to require an API key on incoming requests.
      # OPENCODE_OAI_API_KEY: "change-me"
      OPENCODE_OAI_LOG_LEVEL: "Information"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
