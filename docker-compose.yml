services:
  opencode-oai:
    build: .
    image: opencode-oai:latest
    container_name: opencode-oai
    ports:
      - "5000:5000"
    environment:
      # Point at OpenCode running on the developer's host machine.
      OPENCODE_URL: "http://host.docker.internal:4096"
      OPENCODE_PROVIDER_ID: "github-copilot"
      DEFAULT_MODEL: "gpt-4o"
      # Set to require an API key on incoming requests.
      # OPENCODE_PROXY_API_KEY: "change-me"
      LOG_LEVEL: "Information"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
