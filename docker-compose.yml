services:
  opencode-oai:
    build: .
    image: opencode-oai:latest
    container_name: opencode-oai
    # Share the host's network namespace so `localhost:4096` inside the
    # container reaches OpenCode running on the host's loopback interface.
    # `ports:` and `extra_hosts:` are ignored under host networking.
    network_mode: host
    environment:
      # ── Upstream OpenCode connection ────────────────────────────────────────
      OPENCODE_URL: "http://localhost:4096"
      # OPENCODE_USERNAME: "opencode"
      # OPENCODE_PASSWORD: ""

      # ── Bridge behavior ─────────────────────────────────────────────────────
      OPENCODE_OAI_PORT: "5000"
      OPENCODE_OAI_DEFAULT_PROVIDER: "github-copilot"
      OPENCODE_OAI_DEFAULT_MODEL: "gpt-4o"
      # Set to require an API key on incoming requests.
      # OPENCODE_OAI_API_KEY: "change-me"

      # ── Logging ─────────────────────────────────────────────────────────────
      OPENCODE_OAI_LOG_LEVEL: "Information"
      # Also log prompt/completion *content*, not just per-request metadata.
      # OPENCODE_OAI_LOG_PROMPTS: "true"
      # OPENCODE_OAI_LOG_PREVIEW_CHARS: "500"
    restart: unless-stopped
